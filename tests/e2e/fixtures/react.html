<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>React app</title>
    <script src="/vendor/react.js"></script>
    <script src="/vendor/react-dom.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const e = React.createElement;
      function App() {
        const [name, setName] = React.useState('');
        const [plan, setPlan] = React.useState('basic');
        const [agree, setAgree] = React.useState(false);
        const [n, setN] = React.useState(0);
        const [show, setShow] = React.useState(true);
        return e(
          'main',
          null,
          e('h1', null, 'React app'),
          e('label', { htmlFor: 'name' }, 'Full name'),
          e('input', { id: 'name', value: name, onChange: (ev) => setName(ev.target.value) }),
          e('p', { id: 'out' }, 'Hello ' + name),
          e('label', { htmlFor: 'plan' }, 'Plan'),
          e('select', { id: 'plan', value: plan, onChange: (ev) => setPlan(ev.target.value) }, e('option', { value: 'basic' }, 'Basic'), e('option', { value: 'pro' }, 'Pro')),
          e('p', { id: 'plan-out' }, 'Plan ' + plan),
          e('label', null, e('input', { id: 'agree', type: 'checkbox', checked: agree, onChange: (ev) => setAgree(ev.target.checked) }), ' I agree'),
          e('p', { id: 'agree-out' }, agree ? 'agreed' : 'not agreed'),
          e('button', { id: 'inc', onClick: () => setN(n + 1) }, 'Clicked ' + n),
          e('button', { id: 'toggle', onClick: () => setShow(!show) }, 'Toggle panel'),
          show && e('div', { id: 'panel' }, e('button', { id: 'inner' }, 'Inner action')),
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(e(App));
    </script>
    <script async src="/assist/assist.js" data-key="test"></script>
  </body>
</html>
